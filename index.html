  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      background: #f4f6fb;
      color: #172033;
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border: 1px solid #e3e7ef;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(26, 39, 71, 0.09);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 24px;
      text-align: center;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: #3157d5;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .button:hover {
      background: #2446b8;
      transform: translateY(-2px);
    }

    .button:focus-visible {
      outline: 3px solid #9eb2ff;
      outline-offset: 2px;
    }

    .button.disabled {
      background: #c9ced9;
      color: #697080;
      cursor: not-allowed;
    }

    .button.disabled:hover { transform: none; }

    .button.search {
      grid-column: 1 / -1;
      background: #172033;
    }

    .button.search:hover { background: #2b354a; }

    @media (max-width: 430px) {
      main { padding: 24px 18px; }
      .buttons { grid-template-columns: 1fr; }
      .button.search { grid-column: auto; }
    }
  </style>
</head>
