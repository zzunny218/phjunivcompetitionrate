name: Competition rates
run-name: 경쟁률 갱신
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - collect.py
      - targets.json
      - requirements.txt
      - .github/workflows/refresh.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hourly-rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python collect.py
      - name: Save collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update competition rates'
            git push
          fi
      - name: Prepare page
        run: |
          mkdir -p public
          cp index.html data.json targets.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
